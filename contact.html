<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
  <nav class="bg-blue-600 p-4 text-white">
    <div class="container mx-auto flex justify-between">
      <h1 class="text-xl">My Website</h1>
      <div>
        <a href="index.html" class="mr-4">Home</a>
        <a href="about.html" class="mr-4">About Us</a>
        <a href="game.html" class="mr-4">Play Game</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>
  <div class="container mx-auto p-4">
    <h2 class="text-3xl mb-4 text-center">Contact Us</h2>
    <form id="contactForm" class="max-w-md mx-auto">
      <input type="text" id="name" placeholder="Your Name" class="w-full p-2 mb-4 border" required>
      <input type="email" id="email" placeholder="Your Email" class="w-full p-2 mb-4 border" required>
      <textarea id="message" placeholder="Your Message" class="w-full p-2 mb-4 border" rows="4" required></textarea>
      <button type="submit" class="w-full p-2 bg-blue-500 text-white">Send Message</button>
    </form>
    <p id="formMessage" class="text-center mt-4"></p>
  </div>
  <script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;
      const formMessage = document.getElementById('formMessage');

      try {
        const response = await fetch('/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, message }),
        });
        const result = await response.json();
        formMessage.textContent = result.message;
        if (response.ok) {
          document.getElementById('contactForm').reset();
        }
      } catch (error) {
        formMessage.textContent = 'Error sending message. Try again later.';
      }
    });
  </script>
</body>
</html>
