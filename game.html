<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Game</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    #target {
      width: 50px;
      height: 50px;
      background-color: red;
      border-radius: 50%;
      position: absolute;
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-gray-100">
  <nav class="bg-blue-600 p-4 text-white">
    <div class="container mx-auto flex justify-between">
      <h1 class="text-xl">My Website</h1>
      <div>
        <a href="index.html" class="mr-4">Home</a>
        <a href="about.html" class="mr-4">About Us</a>
        <a href="game.html" class="mr-4">Play Game</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>
  <div class="container mx-auto p-4 text-center">
    <h2 class="text-3xl mb-4">Click the Target!</h2>
    <p class="text-lg mb-4">Score: <span id="score">0</span></p>
    <div id="target"></div>
  </div>
  <script>
    const target = document.getElementById('target');
    const scoreDisplay = document.getElementById('score');
    let score = 0;

    function moveTarget() {
      const maxX = window.innerWidth - 50;
      const maxY = window.innerHeight - 50;
      const newX = Math.random() * maxX;
      const newY = Math.random() * maxY;
      target.style.left = newX + 'px';
      target.style.top = newY + 'px';
    }

    target.addEventListener('click', () => {
      score++;
      scoreDisplay.textContent = score;
      moveTarget();
    });

    moveTarget();
  </script>
</body>
</html>
